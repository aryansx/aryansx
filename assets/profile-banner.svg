<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Saini / sxuce</title>
  <desc id="desc">Developer in the United Kingdom. Linux tools, chemistry exploration, and useful apps.</desc>
